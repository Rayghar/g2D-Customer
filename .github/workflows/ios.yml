name: Build & Upload iOS (Flutter)
on:
  workflow_dispatch:
  push:
    branches: [ versionios2 ]
jobs:
  ios:
    runs-on: macos-14
    env:
      BUNDLE_ID: com.primejet.gas2door  # Set your bundle ID
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      P12_BASE64: ${{ secrets.P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
      

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter deps
        run: flutter pub get

      - name: Flutter clean
        run: flutter clean  # Cleans build artifacts and regenerates if needed

      - name: Force iOS 15 in Podfile
        run: |
          ruby -e "f='ios/Podfile'; c=File.read(f); c=c.gsub(/platform :ios, .*/, \"platform :ios, '15.0'\"); File.write(f,c)"

      - name: Set DEVELOPMENT_TEAM in Xcode project
        run: |
          sed -i '' "s/DEVELOPMENT_TEAM = [A-Z0-9]*/DEVELOPMENT_TEAM = ${TEAM_ID}/g" ios/Runner.xcodeproj/project.pbxproj

      - name: Set Manual Signing and Profile
        run: |
          sed -i '' "s/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = .*/PROVISIONING_PROFILE_SPECIFIER = \"\"/g" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/CODE_SIGN_IDENTITY = \"iPhone Developer\"/CODE_SIGN_IDENTITY = \"Apple Distribution\"/g" ios/Runner.xcodeproj/project.pbxproj

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Install code-signing certificate
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > signing.p12
          security create-keychain -p "" build.keychain
          security import signing.p12 -P "$P12_PASSWORD" -A -k build.keychain
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security find-identity -v -p codesigning build.keychain  # Debug: List signing identities

      - name: Install provisioning profile
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
      

      - name: Inject signing into Release.xcconfig (safe, idempotent)
        shell: bash
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          XCCONFIG="ios/Flutter/Release.xcconfig"

          # Ensure CocoaPods include exists once
          grep -q 'Pods-Runner.release.xcconfig' "$XCCONFIG" || \
            echo '#include "Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"' >> "$XCCONFIG"

          # Remove any prior injected block (our marker only)
          sed -i '' '/^\/\/ --- Signing injected by CI ---/,$d' "$XCCONFIG" || true

          # Append fresh values (shell expands PROFILE_NAME & TEAM_ID here)
          {
            echo '// --- Signing injected by CI ---'
            echo 'PRODUCT_BUNDLE_IDENTIFIER = com.primejet.gas2door'
            echo 'CODE_SIGN_STYLE = Manual'
            echo 'CODE_SIGN_IDENTITY = Apple Distribution'
            echo "PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME}"
            echo "DEVELOPMENT_TEAM = ${TEAM_ID}"
          } >> "$XCCONFIG"

          echo "Final $XCCONFIG:"
          cat "$XCCONFIG"

          

      - name: Force Manual signing in project (fallback)
        shell: bash
        run: |
          # Flip any Automatic to Manual (if present). Safe to run even if already Manual.
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' ios/Runner.xcodeproj/project.pbxproj

          # If DEVELOPMENT_TEAM keys don't exist (your case), add them to each build config.
          # Insert right after PRODUCT_BUNDLE_IDENTIFIER lines for the Runner target.
          # This keeps the change surgical and idempotent.
          perl -0777 -pe 's/(PRODUCT_BUNDLE_IDENTIFIER = com\.primejet\.gas2door;)/$1\n\t\t\t\tDEVELOPMENT_TEAM = '"$TEAM_ID"';/g' \
            ios/Runner.xcodeproj/project.pbxproj > /tmp/p.pbxproj && mv /tmp/p.pbxproj ios/Runner.xcodeproj/project.pbxproj

      - name: Write and parse provisioning profile safely
        shell: bash
        run: |
          set -euo pipefail

          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"

          # 1) Write the .mobileprovision robustly (handle both BSD and GNU base64)
          # Use printf (not echo) to avoid extra newline issues.
          if printf '%s' "$MOBILEPROVISION_BASE64" | base64 -D > "$PP_DIR/profile.mobileprovision" 2>/dev/null; then
            :
          elif printf '%s' "$MOBILEPROVISION_BASE64" | base64 --decode > "$PP_DIR/profile.mobileprovision" 2>/dev/null; then
            :
          elif printf '%s' "$MOBILEPROVISION_BASE64" | base64 -d > "$PP_DIR/profile.mobileprovision" 2>/dev/null; then
            :
          else
            echo "Failed to base64-decode MOBILEPROVISION_BASE64" >&2
            exit 1
          fi

          # 2) Sanity-check the file
          if [ ! -s "$PP_DIR/profile.mobileprovision" ]; then
            echo "Provisioning profile not written or empty. Check your MOBILEPROVISION_BASE64 secret." >&2
            ls -l "$PP_DIR" || true
            exit 1
          fi

          PP="$PP_DIR/profile.mobileprovision"

          # 3) Try to decode CMS to a plist; if that fails, maybe it's already a plist
          if /usr/bin/security cms -D -i "$PP" -o /tmp/profile.plist 2>/dev/null; then
            :
          else
            # If it's already a plist, just copy it
            cp "$PP" /tmp/profile.plist
          fi

          # 4) Confirm we have a plist with content
          if [ ! -s /tmp/profile.plist ]; then
            echo "Could not decode profile. Is the file a valid .mobileprovision?" >&2
            file "$PP" || true
            exit 1
          fi

          # 5) Extract useful fields
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist 2>/dev/null || true)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist 2>/dev/null || true)

          if [ -z "${PROFILE_NAME:-}" ] || [ -z "${PROFILE_UUID:-}" ]; then
            echo "Profile plist missing Name/UUID; dumping a summary for debugging:" >&2
            /usr/bin/plutil -p /tmp/profile.plist || true
            exit 1
          fi

          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

          echo "Resolved profile:"
          echo "  Name: $PROFILE_NAME"
          echo "  UUID: $PROFILE_UUID"

      - name: Inject signing into Release.xcconfig (idempotent)
        shell: bash
        run: |
          XCCONFIG="ios/Flutter/Release.xcconfig"

          # 1) Ensure the CocoaPods include is correct
          sed -i '' 's/#include\? /#include /g' "$XCCONFIG" || true
          grep -q 'Pods-Runner.release.xcconfig' "$XCCONFIG" || \
            echo '#include "Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"' >> "$XCCONFIG"

          # 2) Remove any previous injected block
          sed -i '' '/^\/\/ --- Signing injected by CI ---/,$d' "$XCCONFIG" || true

          # 3) Append fresh, concrete values (use SPECIFIER by name; UUID also works)
          {
            echo '// --- Signing injected by CI ---'
            echo 'PRODUCT_BUNDLE_IDENTIFIER = com.primejet.gas2door'
            echo 'CODE_SIGN_STYLE = Manual'
            echo 'CODE_SIGN_IDENTITY = Apple Distribution'
            echo "PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME}"
            echo "DEVELOPMENT_TEAM = ${TEAM_ID}"
          } >> "$XCCONFIG"

      
      - name: Pod install
        working-directory: ios
        run: pod install

      - name: Build IPA (Release)
        run: flutter build ipa --release --verbose

      - name: Create App Store Connect API key file
        working-directory: ios
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p fastlane
          echo "{ \"key_id\": \"${ASC_API_KEY_ID}\", \"issuer_id\": \"${ASC_API_ISSUER_ID}\", \"in_house\": false, \"private_key\": \"$(echo $ASC_API_KEY_P8_BASE64 | base64 --decode | awk '{printf \"%s\\n\", $0}' | sed 's/\\//g')\" }" > fastlane/api_key.json

      - name: Upload to TestFlight (fastlane pilot)
        working-directory: ios
        run: |
          fastlane pilot upload \
            --api_key_path fastlane/api_key.json \
            --ipa ../build/ios/ipa/Runner.ipa \
            --skip_waiting_for_build_processing false

      - name: Save IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa