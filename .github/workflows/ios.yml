name: Build & Upload iOS (Flutter) — VERBOSE

on:
  workflow_dispatch:
  push:
    branches: [ versionios4 ]

jobs:
  ios:
    runs-on: macos-15

    env:
      BUNDLE_ID: com.primejet.gas2door
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      P12_BASE64: ${{ secrets.P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Install iOS Platform for Xcode 16.1
        run: |
          set -euxo pipefail
          sudo xcodebuild -downloadPlatform iOS
          xcodebuild -showsdks

      - name: Pin DEVELOPER_DIR (safety)
        run: echo "DEVELOPER_DIR=/Applications/Xcode_16.1.app" >> $GITHUB_ENV

      - name: Verify iOS SDK installation
        run: |
          set -euxo pipefail
          xcodebuild -showsdks
          SDKDIR="/Applications/Xcode_16.1.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs"
          test -d "$SDKDIR" || { echo "FATAL: $SDKDIR missing"; exit 1; }
          ls -1 "$SDKDIR"

      - name: Print runner & toolchain versions
        run: |
          set -euxo pipefail
          sw_vers || true
          xcodebuild -version
          xcrun --version
          swift --version
          ruby -v
          gem env home
          python3 --version || true
          node -v || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: |
          set -euxo pipefail
          flutter --version
          flutter doctor -v

      - name: Flutter clean & deps (order matters)
        run: |
          set -euxo pipefail
          flutter clean
          flutter pub get
          test -f ios/Flutter/Generated.xcconfig || { echo "ERROR: ios/Flutter/Generated.xcconfig missing"; ls -la ios/Flutter || true; exit 1; }

      - name: Bump iOS build number (Timestamp Strategy)
        run: |
          set -euxo pipefail
          PLIST="ios/Runner/Info.plist"
          NEW_BUILD_NUM=$(date +%Y%m%d%H%M)
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" >/dev/null 2>&1 || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0.0" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD_NUM" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $NEW_BUILD_NUM" "$PLIST"
          echo "Build number updated to: $NEW_BUILD_NUM"

      - name: Handle Encryption Compliance (Auto-answer 'No')
        run: |
          set -euxo pipefail
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"

      - name: Set marketing version to match App Store (1.0.2)
        run: |
          set -euxo pipefail
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.2" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0.2" "$PLIST"
          echo "Marketing version forced to 1.0.2"

      - name: Ensure CocoaPods toolchain
        run: |
          set -euxo pipefail
          sudo gem install cocoapods --no-document
          pod --version
          pod repo update

      - name: Force iOS 15 in Podfile (idempotent)
        run: |
          set -euxo pipefail
          ruby -e "f='ios/Podfile'; if File.exist?(f); c=File.read(f); c=c.gsub(/platform :ios, .*/, \"platform :ios, '15.0'\"); File.write(f,c); else; puts 'WARN: ios/Podfile not found'; end"

      - name: Stamp DEVELOPMENT_TEAM and manual signing in Xcode project
        run: |
          set -euxo pipefail
          PBX=ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/DEVELOPMENT_TEAM = [A-Z0-9]*/DEVELOPMENT_TEAM = ${TEAM_ID}/g" "$PBX" || true
          sed -i '' "s/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g" "$PBX" || true
          sed -i '' "s/CODE_SIGN_IDENTITY = \"iPhone Developer\"/CODE_SIGN_IDENTITY = \"Apple Distribution\"/g" "$PBX" || true
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = .*/PROVISIONING_PROFILE_SPECIFIER = \"\"/g" "$PBX" || true
          perl -0777 -pe 's/(PRODUCT_BUNDLE_IDENTIFIER = '"$BUNDLE_ID"';)/$1\n\t\t\t\tDEVELOPMENT_TEAM = '"$TEAM_ID"';/g' "$PBX" > /tmp/p.pbxproj || true
          if [ -s /tmp/p.pbxproj ]; then mv /tmp/p.pbxproj "$PBX"; fi
          grep -nE "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE" "$PBX" || true

      - name: Install fastlane
        run: |
          set -euxo pipefail
          gem install fastlane --no-document
          fastlane --version

      - name: Import signing certificate (keychain)
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euxo pipefail
          echo "$P12_BASE64" | base64 --decode > signing.p12
          security create-keychain -p "" build.keychain
          security import signing.p12 -P "$P12_PASSWORD" -A -k build.keychain
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security find-identity -v -p codesigning build.keychain || true

      - name: Decode & parse provisioning profile
        shell: bash
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          set -euxo pipefail
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"

          TMP_PP="/tmp/profile.mobileprovision"
          if printf '%s' "$MOBILEPROVISION_BASE64" | base64 -D > "$TMP_PP" 2>/dev/null; then :
          elif printf '%s' "$MOBILEPROVISION_BASE64" | base64 --decode > "$TMP_PP" 2>/dev/null; then :
          elif printf '%s' "$MOBILEPROVISION_BASE64" | base64 -d > "$TMP_PP" 2>/dev/null; then :
          else
            echo "Failed to base64-decode MOBILEPROVISION_BASE64" >&2; exit 1
          fi

          security cms -D -i "$TMP_PP" -o /tmp/profile.plist
          /usr/bin/plutil -lint /tmp/profile.plist
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)
          APPID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/profile.plist || true)
          : "${NAME:?Provisioning profile Name missing}"
          : "${UUID:?Provisioning profile UUID missing}"

          INSTALL_PP="$PP_DIR/${UUID}.mobileprovision"
          cp "$TMP_PP" "$INSTALL_PP"

          echo "PROFILE_NAME=$NAME" >> $GITHUB_ENV
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV
          echo "Installed profile: $NAME ($UUID) at $INSTALL_PP"
          echo "App Identifier in profile: ${APPID:-unknown}"
          mkdir -p build-logs && cp /tmp/profile.plist build-logs/profile.plist

      # ==========================
      # ✅ SiWA FIX (MINIMAL)
      # 1) Fail fast if provisioning profile doesn't include SiWA entitlement
      # ==========================
      - name: Verify provisioning profile supports Sign in with Apple (SiWA)
        shell: bash
        run: |
          set -euxo pipefail
          PL="/tmp/profile.plist"
          if [ ! -f "$PL" ]; then
            echo "FATAL: /tmp/profile.plist not found (profile parse step failed?)"
            exit 1
          fi

          # If this key is missing, App Store signing for SiWA will fail later.
          if /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.applesignin" "$PL" >/dev/null 2>&1; then
            echo "✅ Provisioning profile includes SiWA entitlement:"
            /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.applesignin" "$PL" || true
          else
            echo "❌ Provisioning profile DOES NOT include Sign in with Apple entitlement."
            echo "Fix in Apple Developer Portal: enable 'Sign in with Apple' capability for this App ID"
            echo "and regenerate the provisioning profile (App Store / Distribution), then update MOBILEPROVISION_BASE64."
            exit 1
          fi

      # ==========================
      # ✅ SiWA FIX (MINIMAL)
      # 2) Ensure Runner.entitlements contains com.apple.developer.applesignin = [Default]
      # 3) Ensure project uses CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements
      # ==========================
      - name: Enable Sign in with Apple entitlement + wire into Xcode project
        shell: bash
        run: |
          set -euxo pipefail

          ENT="ios/Runner/Runner.entitlements"
          PBX="ios/Runner.xcodeproj/project.pbxproj"

          test -f "$ENT" || { echo "FATAL: $ENT missing"; exit 1; }
          test -f "$PBX" || { echo "FATAL: $PBX missing"; exit 1; }

          # Ensure entitlement exists: com.apple.developer.applesignin = (Default)
          /usr/bin/plutil -lint "$ENT"

          if /usr/libexec/PlistBuddy -c "Print :com.apple.developer.applesignin" "$ENT" >/dev/null 2>&1; then
            echo "SiWA entitlement already present in Runner.entitlements"
          else
            echo "Adding SiWA entitlement to Runner.entitlements"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin array" "$ENT"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin:0 string Default" "$ENT"
          fi

          echo "=== Runner.entitlements ==="
          /usr/libexec/PlistBuddy -c "Print" "$ENT" || true

          # Ensure CODE_SIGN_ENTITLEMENTS is set somewhere in build settings.
          # We do an idempotent insert near PRODUCT_BUNDLE_IDENTIFIER if not found at all.
          if grep -q "CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;" "$PBX"; then
            echo "CODE_SIGN_ENTITLEMENTS already wired in project.pbxproj"
          else
            echo "Wiring CODE_SIGN_ENTITLEMENTS into project.pbxproj (idempotent patch)"
            perl -0777 -i -pe 's/(PRODUCT_BUNDLE_IDENTIFIER = [^;]+;\n)/$1\t\t\t\tCODE_SIGN_ENTITLEMENTS = Runner\/Runner.entitlements;\n/gm' "$PBX"
          fi

          echo "=== Grep entitlements wiring ==="
          grep -n "CODE_SIGN_ENTITLEMENTS" "$PBX" | head -n 50 || true

      - name: Inject signing into Release.xcconfig (safe)
        shell: bash
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ env.PROFILE_NAME }}
        run: |
          set -euxo pipefail
          : "${PROFILE_NAME:?PROFILE_NAME not found. Ensure the decode/parse step ran successfully.}"
          XCCONFIG="ios/Flutter/Release.xcconfig"
          grep -q 'Pods-Runner.release.xcconfig' "$XCCONFIG" || echo '#include "Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"' >> "$XCCONFIG"
          sed -i '' '/^\/\/ --- Signing injected by CI ---/,$d' "$XCCONFIG" || true
          {
            echo '// --- Signing injected by CI ---'
            echo "PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID}"
            echo 'CODE_SIGN_STYLE = Manual'
            echo 'CODE_SIGN_IDENTITY = Apple Distribution'
            echo "PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME}"
            echo "DEVELOPMENT_TEAM = ${TEAM_ID}"
          } >> "$XCCONFIG"
          echo "==== Final Release.xcconfig ===="; cat "$XCCONFIG"
          mkdir -p build-logs && cp "$XCCONFIG" build-logs/Release.xcconfig

      - name: Reset CocoaPods resolution (clean resolve)
        working-directory: ios
        run: |
          set -euxo pipefail
          rm -rf Pods Podfile.lock
          pod repo update

      - name: Pod install (log & artifact)
        working-directory: ios
        run: |
          set -euxo pipefail
          pod install | tee ../build-logs/pod_install.log

      - name: Show Xcode build settings (after pods)
        working-directory: ios
        run: |
          set -euxo pipefail
          echo "=== List schemes (workspace) ==="
          xcodebuild -workspace Runner.xcworkspace -list || true
          echo "=== Show destinations for Runner ==="
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -showdestinations || true
          echo "=== Write build settings (workspace) ==="
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' -showBuildSettings > ../build-logs/xcodebuild_showBuildSettings.txt || true
          echo "Wrote: ../build-logs/xcodebuild_showBuildSettings.txt (size: $(wc -c < ../build-logs/xcodebuild_showBuildSettings.txt) bytes)"

      - name: Write ExportOptions.plist for app-store export
        working-directory: ios
        env:
          PROFILE_NAME: ${{ env.PROFILE_NAME }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
          TEAM_ID: ${{ env.TEAM_ID }}
        run: |
          set -euxo pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>compileBitcode</key><false/>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>signingCertificate</key><string>Apple Distribution</string>
          </dict>
          </plist>
          PLIST
          echo "==== ExportOptions.plist ===="
          cat ExportOptions.plist

      - name: Install Ruby Gem
        run: gem install xcodeproj

      - name: Fix Xcode Project Structure
        run: ruby fix_project.rb

      - name: Build IPA (Release, verbose)
        run: |
          set -euxo pipefail
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist --verbose || BUILD_FAILED=1

          mkdir -p build-logs
          RESULT=$(ls -t ~/Library/Developer/Xcode/DerivedData/*/Logs/Build/*.xcresult 2>/dev/null | head -n 1 || true)
          if [ -n "${RESULT:-}" ]; then
            echo "Found xcresult: $RESULT"
            /usr/bin/xcresulttool get --format json --path "$RESULT" > build-logs/archive_result.json || true
          fi

          ls -l build/ios/ipa || true
          if ls build/ios/archive/*.xcarchive 1>/dev/null 2>&1; then
            echo "Found xcarchive(s):"; ls -l build/ios/archive
          fi

          test -z "${BUILD_FAILED:-}" || exit 1

      - name: Diagnose effective build settings (Release)
        working-directory: ios
        run: |
          set -euxo pipefail
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -showBuildSettings | tee ../build-logs/xcodebuild_effective_settings.txt
          grep -E 'PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_ENTITLEMENTS' ../build-logs/xcodebuild_effective_settings.txt || true

      - name: Locate artifacts (IPA and/or .xcarchive)
        run: |
          set -euxo pipefail
          IPA_REL="$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit 2>/dev/null || true)"
          ARCHIVE_REL="$(find build/ios/archive -maxdepth 1 -type d -name '*.xcarchive' -print -quit 2>/dev/null || true)"

          echo "Resolved IPA_REL=${IPA_REL:-<none>}"
          echo "Resolved ARCHIVE_REL=${ARCHIVE_REL:-<none>}"

          if [ -n "${IPA_REL:-}" ]; then
            echo "IPA_PATH=$GITHUB_WORKSPACE/$IPA_REL" >> "$GITHUB_ENV"
          fi
          if [ -n "${ARCHIVE_REL:-}" ]; then
            echo "ARCHIVE_PATH=$GITHUB_WORKSPACE/$ARCHIVE_REL" >> "$GITHUB_ENV"
          fi

      - name: Fallback export if IPA missing
        run: |
          set -euxo pipefail
          if ls build/ios/ipa/*.ipa 1>/dev/null 2>&1; then
            echo "IPA already present in build/ios/ipa — fallback export not needed."
            exit 0
          fi

          : "${ARCHIVE_PATH:?No ARCHIVE_PATH available for export}"

          APP_PATH="${ARCHIVE_PATH}/Products/Applications/Runner.app"
          if [ ! -f "${APP_PATH}/embedded.mobileprovision" ]; then
            echo "ERROR: Archive missing embedded.mobileprovision — not signed during archive."
            echo "       Ensure Release.xcconfig injection ran BEFORE archive and sets:"
            echo "       PROVISIONING_PROFILE_SPECIFIER=${PROFILE_NAME}"
            echo "       CODE_SIGN_IDENTITY=Apple Distribution"
            echo "       DEVELOPMENT_TEAM=${TEAM_ID}"
            exit 1
          fi

          mkdir -p build/ios/export
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/export

          echo "Fallback export directory contents:"
          ls -l build/ios/export || true

          IPA_FALLBACK="$(find build/ios/export -maxdepth 1 -type f -name '*.ipa' -print -quit || true)"
          if [ -n "${IPA_FALLBACK:-}" ]; then
            echo "IPA_PATH=$IPA_FALLBACK" >> "$GITHUB_ENV"
          fi

      - name: Prepare App Store Connect API key
        working-directory: ios
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euxo pipefail
          mkdir -p fastlane
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > fastlane/AuthKey_${ASC_API_KEY_ID}.p8
          cat > fastlane/api_key.json <<JSON
          {
            "key_id": "${ASC_API_KEY_ID}",
            "issuer_id": "${ASC_API_ISSUER_ID}",
            "key": "$(awk '{printf "%s\\n", $0}' fastlane/AuthKey_${ASC_API_KEY_ID}.p8)"
          }
          JSON
          echo "Wrote fastlane/api_key.json (redacted)"

      - name: Save IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            build/ios/ipa/*.ipa
            build/ios/export/*.ipa
          if-no-files-found: warn

      - name: Upload troubleshooting bundle (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-troubleshooting-bundle
          path: |
            build-logs/**
            ios/ExportOptions.plist
            ios/Runner.xcodeproj/project.pbxproj
            ios/Runner.xcworkspace/contents.xcworkspacedata
            ios/Podfile
            ios/Podfile.lock
            ios/Pods/Manifest.lock
          if-no-files-found: warn
