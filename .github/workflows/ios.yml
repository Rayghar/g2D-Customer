name: Build & Upload iOS (Flutter)
on:
  workflow_dispatch:
  push:
    branches: [ versionios2 ]
jobs:
  ios:
    runs-on: macos-14
    env:
      BUNDLE_ID: com.primejet.gas2door  # Set your bundle ID
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter deps
        run: flutter pub get

      - name: Ensure iOS project exists
        run: flutter create --org com.primejet --platforms=ios .

      - name: Force iOS 13 in Podfile
        run: |
          ruby -e "f='ios/Podfile'; c=File.read(f); c=c.gsub(/platform :ios, .*/, \"platform :ios, '13.0'\"); File.write(f,c)"

      - name: Set DEVELOPMENT_TEAM in Xcode project
        run: |
          sed -i '' "s/DEVELOPMENT_TEAM = [A-Z0-9]*/DEVELOPMENT_TEAM = ${TEAM_ID}/g" ios/Runner.xcodeproj/project.pbxproj

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Install code-signing certificate
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > signing.p12
          security create-keychain -p "" build.keychain
          security import signing.p12 -P "$P12_PASSWORD" -A -k build.keychain
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Install provisioning profile
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
      
      - name: Pod install
        working-directory: ios
        run: pod install

      - name: Build IPA (Release)
        run: flutter build ipa --release --verbose

      - name: Create App Store Connect API key file
        working-directory: ios
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p fastlane
          echo "{ \"key_id\": \"${ASC_API_KEY_ID}\", \"issuer_id\": \"${ASC_API_ISSUER_ID}\", \"in_house\": false, \"private_key\": \"$(echo $ASC_API_KEY_P8_BASE64 | base64 --decode | awk '{printf \"%s\\n\", $0}' | sed 's/\\//g')\" }" > fastlane/api_key.json

      - name: Upload to TestFlight (fastlane pilot)
        working-directory: ios
        run: |
          fastlane pilot upload \
            --api_key_path fastlane/api_key.json \
            --ipa ../build/ios/ipa/Runner.ipa \
            --skip_waiting_for_build_processing false

      - name: Save IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa