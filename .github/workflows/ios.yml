name: Build & Upload iOS (Flutter)

on:
  workflow_dispatch:
  push:
    branches: [ versionios4 ]   # <-- adjust to your branch

jobs:
  ios:
    runs-on: macos-15

    permissions:
      contents: read

    env:
      # ---- App / Signing identifiers ----
      BUNDLE_ID: com.primejet.gas2door              # <-- your bundle id
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}         # e.g. 1A2B3C4D5E
      PROFILE_NAME: MyApp_AppStore_Profile          # <-- EXACT name of the .mobileprovision in Apple Dev portal

      # ---- Secrets you already have in your repo settings ----
      P12_BASE64: ${{ secrets.P12_BASE64 }}         # base64-encoded .p12
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}     # password for the .p12
      MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}  # base64-encoded .mobileprovision
      APP_STORE_CONNECT_USERNAME: ${{ secrets.APP_STORE_CONNECT_USERNAME }} # Apple ID (email)
      APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}   # app-specific password for that Apple ID

      # ---- Build config ----
      FLUTTER_VERSION: "3.24.3"   # keep or change; must match your toolchain requirements
      XCODE_VERSION: "16.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional: pin Xcode (you already do this)
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Ensure iOS SDK present
        run: |
          set -euxo pipefail
          sudo xcodebuild -downloadPlatform iOS
          xcodebuild -showsdks
          echo "DEVELOPER_DIR=/Applications/Xcode_${XCODE_VERSION}.app" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      # ---------- VERSIONING (make sure build number > 50) ----------
      # Option A: trust pubspec.yaml values that you commit.
      - name: Show Flutter version from pubspec
        run: |
          grep '^version:' pubspec.yaml || true

      # ---------- CREATE TEMP KEYCHAIN & INSTALL CERT ----------
      - name: Create temporary keychain
        run: |
          set -euxo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

      - name: Import .p12 signing certificate to keychain
        run: |
          set -euxo pipefail
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Allow codesign to use the key non-interactively
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Show identities for debugging
          security find-identity -v "$KEYCHAIN_PATH" || true

      # ---------- INSTALL PROVISIONING PROFILE ----------
      - name: Install provisioning profile
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          # Extract UUID to save with correct name
          UUID=$(/usr/libexec/PlistBuddy -c Print:UUID /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV
          echo "Installed profile UUID: $UUID"

      # ---------- BUILD (ARCHIVE) ----------
      - name: Flutter build iOS (creates Xcode project files)
        run: flutter build ios --release --no-codesign

      - name: Archive with xcodebuild
        working-directory: ios
        run: |
          set -euxo pipefail
          ARCHIVE_PATH="$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive"
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> $GITHUB_ENV

      # ---------- EXPORT IPA ----------
      - name: Write ExportOptions.plist (App Store)
        run: |
          cat > ios/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>generateAppStoreInformation</key><false/>
            <key>uploadBitcode</key><false/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        run: |
          set -euxo pipefail
          EXPORT_PATH="$GITHUB_WORKSPACE/build/ios/export"
          mkdir -p "$EXPORT_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$EXPORT_PATH" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"
          IPA_PATH=$(find "$EXPORT_PATH" -name "*.ipa" -maxdepth 1 | head -n1)
          echo "IPA_PATH=$IPA_PATH" >> $GITHUB_ENV
          ls -lah "$EXPORT_PATH"

      # ---------- UPLOAD TO APP STORE CONNECT ----------
      - name: Upload .ipa to App Store Connect (Transporter)
        run: |
          set -euxo pipefail
          xcrun iTMSTransporter -m upload \
            -assetFile "$IPA_PATH" \
            -u "$APP_STORE_CONNECT_USERNAME" \
            -p "$APP_SPECIFIC_PASSWORD" \
            -v informational \
            -k 100000

      # ---------- ARTIFACTS ----------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.IPA_PATH }}
            ios/ExportOptions.plist

      - name: Final summary
        run: |
          echo "::notice title=Bundle ID::${BUNDLE_ID}"
          echo "::notice title=Archive::${ARCHIVE_PATH}"
          echo "::notice title=IPA::${IPA_PATH}"
          echo "If the upload step succeeded, the build will show up in App Store Connect > TestFlight after Apple finishes processing."
