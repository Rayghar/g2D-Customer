name: primejet_mobile
description: A gas delivery platform built with Flutter
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: 1.4.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  cloud_firestore: ^5.4.4
  socket_io_client: ^3.1.2
  google_fonts: ^6.1.0
  google_maps_flutter:  ^2.7.0
  haptic_feedback: ^ 0.5.1+1
  fluttertoast: ^8.2.8
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  flutter_spinkit: ^5.2.1
  cached_network_image: ^3.4.0
  flutter_rating_bar: ^4.0.1
  flutter_stripe: ^10.0.0 # Check for the latest version on pub.dev
  flutter_dotenv: ^5.1.0   # For managing API keys
  flutter_animate: ^4.5.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.3.0
  intl: 0.17.0 
  share_plus: ^11.0.0
  geolocator: ^14.0.0
  geocoding: ^3.0.0  
  get: ^4.6.6
  pinput: ^4.0.0
  google_places_flutter: ^2.1.0
  google_sign_in: ^6.2.1
  permission_handler: ^11.3.1
  firebase_auth: ^5.6.2
  flutter_local_notifications: ^19.3.0
  flutter_easyloading: ^3.0.3
  monnify_payment_sdk: ^1.0.5
  sentry_flutter: ^9.5.0
  font_awesome_flutter: ^10.7.0




  

dev_dependencies:

  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  webview_flutter: ^4.13.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  ios: true
  image_path_ios: assets/gas2door_logo1.png
  

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
 