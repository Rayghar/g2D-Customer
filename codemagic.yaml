workflows:
  ios-build:  # Name your iOS workflow
    name: iOS Build and Deploy
    environment:
      flutter: stable  # Locks to your current Flutter (no upgrade)
      groups:
        - app_store_connect_api  # For App Store upload (add keys in dashboard)
      vars:
        BUNDLE_ID: "ng.gas2door.customer"  # Your app's bundle ID
    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get  # Resolves packages and SPM (fixes scheme)
      - name: Clean iOS and install pods
        script: |
          flutter clean
          cd ios
          rm -rf Pods Podfile.lock ~/Library/Developer/Xcode/DerivedData || true
          pod deintegrate || true
          pod install --repo-update  # Runs on Mac CI – generates Runner scheme
          cd ..
      - name: Build IPA
        script: |
          flutter build ipa --release  # Builds with scheme; auto-codesigns if keys set
    artifacts:
      - build/ios/ipa/*.ipa  # IPA file
      - ios/Runner.xcarchive/**/*
    publishing:
      app_store_connect:  # Auto-upload to App Store Connect
        api_key: $APP_STORE_CONNECT_API_KEY_PATH  # Upload cert path (set in dashboard)
        skip_build_profiles: true